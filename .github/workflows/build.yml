name: Build desktop applications
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npx electron-builder --mac --arm64 --publish never
            name: macOS-Apple-Silicon
          - os: macos-latest
            command: npx electron-builder --mac --x64 --publish never
            name: macOS-Intel
          - os: windows-latest
            command: npm run dist:win:msi
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Install media tools on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg
      - name: Install media tools on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:browser-desktop
      - run: npm run test:hosted-browser
      - run: npm run test:stream-browser
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run test:windows-msi
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: LensDesk-${{ matrix.name }}
          path: |
            release/*.msi
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
