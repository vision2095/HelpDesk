name: LensDesk 2.0 Native Windows Build & Verification

on:
  push:
    branches: ["main", "native-windows-host", "windows-native-final-rebuild"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-native:
    name: Build & Verify Native Windows x64 Host
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm install

      - name: Install Media Tools and NSIS
        run: choco install ffmpeg nsis -y --no-progress

      - name: Build React 19 Production Bundle
        run: npm run build

      - name: Create Self-Contained Frontend Resource Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath "src-native/resources/dist_bundle.zip" -Force
          Copy-Item "src-native/resources/dist_bundle.zip" "apps/windows/src-native/resources/dist_bundle.zip" -Force
          Write-Host "Created dist_bundle.zip: $((Get-Item 'src-native/resources/dist_bundle.zip').Length) bytes"

      - name: Run Core Test Suite
        run: npm test

      - name: Configure CMake Native Host (MSVC C++20)
        run: |
          cmake -S src-native -B build-native -A x64 -DCMAKE_BUILD_TYPE=Release -DLENSDESK_ENABLE_TEST_AUTH=OFF

      - name: Compile RuntimeHost.exe & RuntimeHostAccessibility.exe (C++20 MSVC)
        run: |
          cmake --build build-native --config Release --verbose --target RuntimeHost
          cmake --build build-native --config Release --verbose --target RuntimeHostAccessibility

      - name: Configure Nested Windows Workspace Host (W-08)
        run: |
          cmake -S apps/windows/src-native -B build-native-apps -A x64 -DCMAKE_BUILD_TYPE=Release -DLENSDESK_ENABLE_TEST_AUTH=OFF

      - name: Compile Nested Windows Workspace Host (W-08)
        run: |
          cmake --build build-native-apps --config Release --verbose --target RuntimeHost

      - name: Verify PE Binary Architecture (Zero Electron Audit)
        run: |
          node scripts/verify-native-binary.mjs build-native/bin/Release/RuntimeHost.exe

      - name: Run Native Architecture Unit Tests
        run: |
          node --test tests/native-architecture.test.mjs

      - name: Execute Real Windows Runtime & Win32 Integration Test
        shell: pwsh
        run: |
          pwsh scripts/test-windows-runtime.ps1 -BinaryPath build-native/bin/Release/RuntimeHost.exe

      - name: Execute Signed Accessibility Integration & UIAccess Verification
        shell: pwsh
        run: |
          pwsh scripts/sign-accessibility-binary.ps1 -BinaryPath build-native/bin/Release/RuntimeHostAccessibility.exe -CreateTestCert

      - name: Build isolated GUI fixture host (never packaged)
        run: |
          cmake -S src-native -B build-native-test -A x64 -DCMAKE_BUILD_TYPE=Release -DLENSDESK_ENABLE_TEST_AUTH=ON
          cmake --build build-native-test --config Release --target RuntimeHost
          node scripts/check-windows-auth-fixture.mjs build-native/bin/Release/RuntimeHost.exe build-native-apps/bin/Release/RuntimeHost.exe build-native-test/bin/Release/RuntimeHostTest.exe

      - name: Execute Windows GUI fixture test (not real login or AI)
        run: |
          node scripts/test-interactive-windows.mjs

      - name: Package Standalone Portable Zip (HintLens-identical layout)
        shell: pwsh
        run: |
          # Stage strictly and exclusively ONLY the single application executable file
          $Staging = "release/LensDesk-2.0.0-Windows-x64"
          New-Item -ItemType Directory -Path $Staging -Force | Out-Null
          Copy-Item "build-native/bin/Release/RuntimeHost.exe" "$Staging/RuntimeHost.exe"
          Compress-Archive -Path "$Staging/*" -DestinationPath "release/LensDesk-2.0.0-Windows-x64.zip" -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "release/LensDesk-2.0.0-Windows-x64.zip"))
          Write-Host "ZIP entries count: $($zip.Entries.Count)"
          $zip.Entries | ForEach-Object { Write-Host " - $($_.FullName) ($($_.Length) bytes)" }
          if ($zip.Entries.Count -ne 1) {
            throw "Portable ZIP must contain strictly 1 file (the application), found $($zip.Entries.Count)."
          }
          $forbidden = @('TiWorker.exe','ctfmon.exe','SearchProtocolHost.exe','RuntimeBroker.exe','smartscreen.exe','sihost.exe','SecurityHealthSystray.exe')
          $bad = @($zip.Entries | Where-Object { $forbidden -contains [System.IO.Path]::GetFileName($_.FullName) })
          $zip.Dispose()
          if ($bad.Count -gt 0) { throw "Portable ZIP contains prohibited process names: $($bad.FullName -join ', ')" }
          Copy-Item "release/LensDesk-2.0.0-Windows-x64.zip" "release/LensDesk.zip" -Force
          Copy-Item "release/LensDesk-2.0.0-Windows-x64.zip" "release/LensDeskApp.zip" -Force
          # Also keep RuntimeHost.exe copy in release/ for NSIS installer
          Copy-Item "build-native/bin/Release/RuntimeHost.exe" "release/RuntimeHost.exe" -Force
          Copy-Item "src-native/third_party/webview2/lib/x64/WebView2Loader.dll" "release/WebView2Loader.dll" -Force

      - name: Verify Native Portable ZIP Contents
        run: |
          npm run test:windows-archive -- release/LensDesk-2.0.0-Windows-x64.zip

      - name: Compile NSIS Windows Installer
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $makensis) {
            $makensis = (Get-ChildItem -Path "C:\Program Files*\NSIS\makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1)?.FullName
          }
          Write-Host "Using makensis path: $makensis"
          & $makensis installer/installer.nsi

      - name: Execute Independent Package & Installer Verification Test
        shell: pwsh
        env:
          LENSDESK_DISPOSABLE_WINDOWS_USER: "1"
        run: |
          pwsh scripts/test-windows-distributions.ps1

      - name: Upload Native Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LensDesk-2.0.0-Windows-x64-Native
          path: |
            build-native/bin/Release/RuntimeHost.exe
            build-native/bin/Release/RuntimeHostAccessibility.exe
            src-native/third_party/webview2/lib/x64/WebView2Loader.dll
            release/LensDesk-2.0.0-Windows-x64.zip
            release/LensDesk.zip
            release/LensDesk-2.0.0-Setup.exe
            release/interactive-evidence
          if-no-files-found: error
